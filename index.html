<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="TRAINER"/>
  <meta name="theme-color" content="#080808"/>
  <title>TRAINER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:#060606;color:#fff;-webkit-font-smoothing:antialiased}
    body{overscroll-behavior:none}
    input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
    input[type=number]{-moz-appearance:textfield}
    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-track{background:#111}
    ::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:2px}
    select option{background:#161616;color:#fff}
    #root{min-height:100vh}
  </style>
  <script>
    // Suppress Babel production warning
    const _cw = console.warn.bind(console);
    console.warn = (...a) => { if (typeof a[0] === 'string' && a[0].includes('Babel transformer')) return; _cw(...a); };
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;
 
// ─── STORAGE ──────────────────────────────────────────────────────────────────
const DB = {
  get: (k, fb = null) => {
    try { const r = localStorage.getItem(k); return Promise.resolve(r ? JSON.parse(r) : fb); }
    catch { return Promise.resolve(fb); }
  },
  set: (k, v) => {
    try { localStorage.setItem(k, JSON.stringify(v)); } catch {}
    return Promise.resolve();
  },
};
 
// ─── CONSTANTS ────────────────────────────────────────────────────────────────
const COLORS = { gym:"#FF4D00", food:"#00C875", padel:"#00BFFF", dash:"#A259FF" };
 
const WORKOUT_TEMPLATES = {
  1: { label:"DAY 1", title:"Quads + Back", blocks:[
    { id:"b1", sets:4, exercises:[{name:"Hack Squat",type:"weighted"}] },
    { id:"b2", sets:4, exercises:[{name:"Lat Pull Down",type:"weighted"}] },
    { id:"b3", sets:3, exercises:[{name:"One Arm DB Row",type:"weighted"},{name:"DB Bicep Curls",type:"weighted"}] },
    { id:"b4", sets:3, exercises:[{name:"Pull Ups",type:"reps"},{name:"Ski Erg",type:"time"}] },
    { id:"b5", sets:3, exercises:[{name:"Leg Extensions",type:"weighted"}] },
  ]},
  2: { label:"DAY 2", title:"Glutes + Shoulders", blocks:[
    { id:"b1", sets:1, exercises:[{name:"Stair Master",type:"time"}] },
    { id:"b2", sets:4, exercises:[{name:"Hip Thrusts",type:"weighted"}] },
    { id:"b3", sets:3, exercises:[{name:"DB Squat",type:"weighted"},{name:"Shoulder Press",type:"weighted"}] },
    { id:"b4", sets:4, exercises:[{name:"RDL",type:"weighted"}] },
    { id:"b5", sets:3, exercises:[{name:"Lateral Raises",type:"weighted"},{name:"Tricep Pushdown",type:"weighted"}] },
  ]},
  3: { label:"DAY 3", title:"Body + Core", blocks:[
    { id:"b1", sets:4, exercises:[{name:"Deadlifts",type:"weighted"},{name:"Plank Shoulder Taps",type:"reps"}] },
    { id:"b2", sets:4, exercises:[{name:"Cable Row",type:"weighted"}] },
    { id:"b3", sets:4, exercises:[{name:"DB Shoulder Press",type:"weighted"},{name:"Single Arm DB Sit Ups",type:"reps"}] },
  ]},
};
 
const ALL_WEIGHTED = [];
Object.values(WORKOUT_TEMPLATES).forEach(w => w.blocks.forEach(b => b.exercises.forEach(ex => {
  if (ex.type === "weighted" && !ALL_WEIGHTED.includes(ex.name)) ALL_WEIGHTED.push(ex.name);
})));
 
const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const MEAL_TYPES = ["Breakfast","Morning Snack","Lunch","Afternoon Snack","Dinner","Post-Workout"];
const EST_CALS = { Breakfast:400,"Morning Snack":150,Lunch:550,"Afternoon Snack":200,Dinner:600,"Post-Workout":250 };
 
const PADEL_INIT = [
  { id:1, category:"Movement", title:"Ready position", note:"Bat held front and slightly high", learned:true },
  { id:2, category:"Movement", title:"Leg movement (løb)", note:"Active footwork, always repositioning", learned:true },
  { id:3, category:"Shots", title:"Bandeja", note:"Overhead defensive shot off the glass", learned:true },
  { id:4, category:"Strategy", title:"Target one player", note:"Serve and return to same player — build pressure", learned:true },
  { id:5, category:"Strategy", title:"Attack in threes", note:"Attack same player 3x before switching", learned:true },
  { id:6, category:"Strategy", title:"Cover the middle", note:"After left side hit → cover middle immediately", learned:true },
  { id:7, category:"Shots", title:"Vibora / Smash", note:"Attacking overhead — power and wrist snap", learned:false },
  { id:8, category:"Movement", title:"Net play", note:"Basic net positioning — refine approach timing", learned:true },
];
 
// ─── HELPERS ──────────────────────────────────────────────────────────────────
const fmt = s => `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
const fmtDate = d => new Date(d).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
const fmtShort = d => new Date(d).toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const today = () => new Date().toISOString().split("T")[0];
const thisWeekStart = () => { const d=new Date(); d.setDate(d.getDate()-d.getDay()+1); d.setHours(0,0,0,0); return d; };
 
const sessionVolume = (log) => {
  let v=0;
  Object.values(log||{}).forEach(sets=>sets.forEach(row=>Object.values(row||{}).forEach(c=>{
    const k=parseFloat(c?.kg),r=parseFloat(c?.reps); if(!isNaN(k)&&!isNaN(r)) v+=k*r;
  })));
  return Math.round(v);
};
 
const sessionMaxKg = (log) => {
  let m=0;
  Object.values(log||{}).forEach(sets=>sets.forEach(row=>Object.values(row||{}).forEach(c=>{
    const k=parseFloat(c?.kg); if(!isNaN(k)&&k>m) m=k;
  })));
  return m;
};
 
// ─── SHARED UI ────────────────────────────────────────────────────────────────
const iSt = { background:"#111", border:"1px solid #2a2a2a", borderRadius:6, color:"#fff",
  fontSize:13, fontFamily:"'DM Mono',monospace", padding:"6px 8px", width:0, flex:1, outline:"none", textAlign:"center" };
 
function Tag({ color, children }) {
  return <span style={{ fontSize:9, fontFamily:"'DM Mono',monospace", letterSpacing:2,
    color, background:color+"18", border:`1px solid ${color}33`, padding:"2px 8px", borderRadius:4, whiteSpace:"nowrap" }}>{children}</span>;
}
function Card({ children, style, onClick }) {
  return <div onClick={onClick} style={{ background:"#0d0d0d", border:"1px solid #1e1e1e", borderRadius:14,
    padding:16, marginBottom:10, cursor:onClick?"pointer":"default", ...style }}>{children}</div>;
}
function Btn({ children, onClick, color="#fff", filled=false, small=false, disabled=false, style={} }) {
  return <button onClick={onClick} disabled={disabled} style={{
    background:filled?color:"transparent", border:`1.5px solid ${disabled?"#222":color}`,
    color:filled?"#000":(disabled?"#333":color), fontFamily:"'DM Mono',monospace",
    fontSize:small?10:12, fontWeight:700, letterSpacing:1.5,
    padding:small?"5px 12px":"9px 20px", borderRadius:8, cursor:disabled?"not-allowed":"pointer",
    textTransform:"uppercase", ...style }}>{children}</button>;
}
function SLabel({ color, children, style={} }) {
  return <div style={{ fontSize:9, color, fontFamily:"'DM Mono',monospace", letterSpacing:3, marginBottom:8, ...style }}>{children}</div>;
}
function Empty({ children }) {
  return <div style={{ textAlign:"center", padding:"48px 0", color:"#222", fontFamily:"'DM Mono',monospace", fontSize:11, letterSpacing:2 }}>{children}</div>;
}
function Loader() {
  return <div style={{ textAlign:"center", padding:"60px 0", color:"#333", fontFamily:"'DM Mono',monospace", fontSize:11, letterSpacing:3 }}>LOADING...</div>;
}
function Tabs({ tabs, active, onChange, color }) {
  return (
    <div style={{ display:"flex", background:"#0d0d0d", borderRadius:10, padding:4, border:"1px solid #1e1e1e", marginBottom:14 }}>
      {tabs.map(([k,l]) => (
        <button key={k} onClick={()=>onChange(k)}
          style={{ flex:1, padding:"8px 0", borderRadius:8, border:"none", cursor:"pointer",
            fontFamily:"'DM Mono',monospace", fontSize:10, fontWeight:700, letterSpacing:1.5,
            background:active===k?"#fff":"none", color:active===k?"#000":"#444", transition:"all .15s" }}>{l}</button>
      ))}
    </div>
  );
}
 
// ─── MINI LINE CHART ──────────────────────────────────────────────────────────
function LineChart({ data, color, height=80, width=300, yLabel="", showDots=true, showDates=true }) {
  if (!data||data.length<2) return <Empty>NOT ENOUGH DATA YET</Empty>;
  const W=width, H=height, P={t:16,b:showDates?24:8,l:36,r:8};
  const iW=W-P.l-P.r, iH=H-P.t-P.b;
  const vals=data.map(d=>d.v), mn=Math.min(...vals), mx=Math.max(...vals), rng=mx-mn||1;
  const px=i=>P.l+(i/(data.length-1))*iW;
  const py=v=>P.t+iH-((v-mn)/rng)*iH;
  const pts=data.map((d,i)=>`${px(i)},${py(d.v)}`).join(" ");
  const area=`M${px(0)},${py(data[0].v)} `+data.slice(1).map((d,i)=>`L${px(i+1)},${py(d.v)}`).join(" ")+
    ` L${px(data.length-1)},${H-P.b} L${px(0)},${H-P.b} Z`;
  const id=`g${color.replace("#","")}`;
  return (
    <svg width={W} height={H} style={{overflow:"visible",maxWidth:"100%"}}>
      <defs><linearGradient id={id} x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stopColor={color} stopOpacity="0.25"/>
        <stop offset="100%" stopColor={color} stopOpacity="0"/>
      </linearGradient></defs>
      {[0,0.5,1].map(f=>{
        const y=P.t+iH*(1-f), val=Math.round(mn+rng*f);
        return <g key={f}>
          <line x1={P.l} y1={y} x2={W-P.r} y2={y} stroke="#1a1a1a" strokeWidth="1"/>
          <text x={P.l-4} y={y+4} textAnchor="end" fill="#333" fontSize="8" fontFamily="'DM Mono',monospace">{val}</text>
        </g>;
      })}
      <path d={area} fill={`url(#${id})`}/>
      <polyline points={pts} fill="none" stroke={color} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round"/>
      {showDots&&data.map((d,i)=>(
        <g key={i}>
          <circle cx={px(i)} cy={py(d.v)} r={3} fill={color}/>
          {showDates&&<text x={px(i)} y={H-P.b+13} textAnchor="middle" fill="#333" fontSize="8" fontFamily="'DM Mono',monospace">
            {fmtShort(d.date)}
          </text>}
        </g>
      ))}
      {yLabel&&<text x={P.l} y={P.t-4} fill="#444" fontSize="8" fontFamily="'DM Mono',monospace">{yLabel}</text>}
    </svg>
  );
}
 
function BarChart({ data, color, height=80, width=300 }) {
  if (!data||!data.length) return <Empty>NO DATA YET</Empty>;
  const W=width, H=height, P={t:12,b:24,l:28,r:8};
  const iW=W-P.l-P.r, iH=H-P.t-P.b;
  const vals=data.map(d=>d.v), mx=Math.max(...vals)||1;
  const bw=Math.max(4,(iW/data.length)-4);
  return (
    <svg width={W} height={H} style={{overflow:"visible",maxWidth:"100%"}}>
      {[0,0.5,1].map(f=>{
        const y=P.t+iH*(1-f);
        return <g key={f}>
          <line x1={P.l} y1={y} x2={W-P.r} y2={y} stroke="#1a1a1a" strokeWidth="1"/>
          <text x={P.l-4} y={y+4} textAnchor="end" fill="#333" fontSize="8" fontFamily="'DM Mono',monospace">{Math.round(mx*f)}</text>
        </g>;
      })}
      {data.map((d,i)=>{
        const x=P.l+(i/(data.length))*(iW)+2;
        const bh=((d.v/mx)*iH)||2;
        const y=P.t+iH-bh;
        return <g key={i}>
          <rect x={x} y={y} width={bw} height={bh} fill={color} opacity="0.8" rx="2"/>
          <text x={x+bw/2} y={H-P.b+12} textAnchor="middle" fill="#333" fontSize="8" fontFamily="'DM Mono',monospace">{d.label}</text>
        </g>;
      })}
    </svg>
  );
}
 
// ─── DASHBOARD ────────────────────────────────────────────────────────────────
function Dashboard({ gymHistory, meals, padelGames }) {
  const C = COLORS.dash;
  const weekStart = thisWeekStart();
  const workoutsThisWeek = gymHistory.filter(s=>new Date(s.date)>=weekStart).length;
 
  // Streak
  const streak = (() => {
    if (!gymHistory.length) return 0;
    const dates=[...new Set(gymHistory.map(s=>{const d=new Date(s.date);d.setHours(0,0,0,0);return d.getTime();}))].sort((a,b)=>b-a);
    let st=0,check=new Date();check.setHours(0,0,0,0);check=check.getTime();
    for (const d of dates) {
      if (d===check||d===check-86400000){st++;check=d-86400000;} else break;
    }
    return st;
  })();
 
  // PRs: max kg ever per exercise
  const prs = {};
  ALL_WEIGHTED.forEach(ex => {
    gymHistory.forEach(sess => {
      const blocks = sess.blocks || [];
      blocks.forEach(b => {
        b.exercises.filter(e=>e.name===ex).forEach(()=>{
          (sess.log?.[b.id]||[]).forEach(row=>{
            const k=parseFloat(row?.[ex]?.kg);
            if (!isNaN(k)&&(!prs[ex]||k>prs[ex].kg)) prs[ex]={kg:k,date:sess.date};
          });
        });
      });
    });
  });
 
  // Today calories
  const todayStr = today();
  const todayMeals = meals.filter(m=>m.day===todayStr||DAYS.some((d,i)=>m.day===d&&i===new Date().getDay()-1));
  // Actually filter by today's date if stored as date string, otherwise by day name
  const todayCal = meals.filter(m=>m.date===todayStr).reduce((a,m)=>a+(parseFloat(m.calories)||0),0);
  const weekCals = (() => {
    const days=[];
    for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(d.toISOString().split("T")[0]);}
    return days.map(d=>({date:d,v:meals.filter(m=>m.date===d).reduce((a,m)=>a+(parseFloat(m.calories)||0),0)}));
  })();
  const weekAvgCal = Math.round(weekCals.filter(d=>d.v>0).reduce((a,d)=>a+d.v,0)/(weekCals.filter(d=>d.v>0).length||1));
 
  // Padel this month
  const monthStart = new Date(); monthStart.setDate(1); monthStart.setHours(0,0,0,0);
  const padelThisMonth = padelGames.filter(g=>new Date(g.date)>=monthStart);
  const wins = padelThisMonth.filter(g=>g.result==="W").length;
  const winPct = padelThisMonth.length ? Math.round(wins/padelThisMonth.length*100) : 0;
  const totalHours = Math.round(padelGames.reduce((a,g)=>a+(parseFloat(g.duration)||0),0)/60*10)/10;
 
  const StatBox = ({label,value,sub,color}) => (
    <div style={{background:"#0d0d0d",border:`1px solid ${color}22`,borderRadius:12,padding:"14px 12px",flex:1,minWidth:0}}>
      <div style={{fontSize:9,color:"#444",fontFamily:"'DM Mono',monospace",letterSpacing:2,marginBottom:6}}>{label}</div>
      <div style={{fontSize:22,fontWeight:700,color,fontFamily:"'DM Mono',monospace",lineHeight:1}}>{value}</div>
      {sub&&<div style={{fontSize:10,color:"#555",fontFamily:"'DM Mono',monospace",marginTop:4}}>{sub}</div>}
    </div>
  );
 
  return (
    <div style={{paddingBottom:20}}>
      <div style={{marginBottom:20}}>
        <div style={{fontSize:9,color:"#444",fontFamily:"'DM Mono',monospace",letterSpacing:4,marginBottom:4}}>TODAY</div>
        <div style={{fontSize:11,color:"#666",fontFamily:"'DM Mono',monospace"}}>{new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"})}</div>
      </div>
 
      <SLabel color={COLORS.gym}>💪 GYM</SLabel>
      <div style={{display:"flex",gap:8,marginBottom:16}}>
        <StatBox label="THIS WEEK" value={workoutsThisWeek} sub="sessions" color={COLORS.gym}/>
        <StatBox label="STREAK" value={`${streak}d`} sub="days in a row" color={COLORS.gym}/>
        <StatBox label="TOTAL" value={gymHistory.length} sub="sessions ever" color={COLORS.gym}/>
      </div>
 
      {Object.keys(prs).length>0&&(
        <Card style={{marginBottom:16}}>
          <SLabel color={COLORS.gym}>PERSONAL RECORDS</SLabel>
          <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
            {Object.entries(prs).map(([ex,pr])=>(
              <div key={ex} style={{background:"#161616",border:`1px solid ${COLORS.gym}22`,borderRadius:8,padding:"8px 12px",flex:1,minWidth:"40%"}}>
                <div style={{fontSize:9,color:"#444",fontFamily:"'DM Mono',monospace",marginBottom:2}}>{ex.toUpperCase()}</div>
                <div style={{fontSize:16,color:COLORS.gym,fontFamily:"'DM Mono',monospace",fontWeight:700}}>{pr.kg} kg</div>
                <div style={{fontSize:9,color:"#333",fontFamily:"'DM Mono',monospace",marginTop:2}}>{fmtShort(pr.date)}</div>
              </div>
            ))}
          </div>
        </Card>
      )}
 
      <SLabel color={COLORS.food}>🥗 NUTRITION</SLabel>
      <div style={{display:"flex",gap:8,marginBottom:16}}>
        <StatBox label="TODAY" value={todayCal>0?`${todayCal}`:"—"} sub="kcal" color={COLORS.food}/>
        <StatBox label="WEEK AVG" value={weekAvgCal>0?`${weekAvgCal}`:"—"} sub="kcal/day" color={COLORS.food}/>
      </div>
      {weekCals.some(d=>d.v>0)&&(
        <Card style={{marginBottom:16}}>
          <SLabel color={COLORS.food}>CALORIES THIS WEEK</SLabel>
          <BarChart data={weekCals.map(d=>({v:d.v,label:new Date(d.date).toLocaleDateString("en-GB",{weekday:"short"}).slice(0,2)}))} color={COLORS.food}/>
        </Card>
      )}
 
      <SLabel color={COLORS.padel}>🎾 PADEL</SLabel>
      <div style={{display:"flex",gap:8,marginBottom:16}}>
        <StatBox label="THIS MONTH" value={padelThisMonth.length} sub="matches" color={COLORS.padel}/>
        <StatBox label="WIN RATE" value={padelThisMonth.length?`${winPct}%`:"—"} sub="this month" color={COLORS.padel}/>
        <StatBox label="TOTAL HRS" value={totalHours||"—"} sub="all time" color={COLORS.padel}/>
      </div>
 
      {gymHistory.length===0&&meals.length===0&&padelGames.length===0&&(
        <Card style={{marginTop:20,textAlign:"center"}}>
          <div style={{fontSize:24,marginBottom:8}}>👋</div>
          <div style={{color:"#fff",fontSize:14,fontFamily:"'Outfit',sans-serif",fontWeight:600,marginBottom:6}}>Welcome to your Trainer</div>
          <div style={{color:"#555",fontSize:12,fontFamily:"'Outfit',sans-serif",lineHeight:1.6}}>
            Start by logging a workout, a meal, or a padel game. Your dashboard will come alive as you track your progress.
          </div>
        </Card>
      )}
    </div>
  );
}
 
// ─── GYM SECTION ─────────────────────────────────────────────────────────────
function GymSection({ tab, setTab, history, setHistory, lastVals, setLastVals }) {
  const C = COLORS.gym;
  const [sessionLog, setSessionLog] = useState({});
  const [customBlocks, setCustomBlocks] = useState({});
  const [activeDay, setActiveDay] = useState(null);
  const [timer, setTimer] = useState(0);
  const [running, setRunning] = useState(false);
  const [restSecs, setRestSecs] = useState(0);
  const [restActive, setRestActive] = useState(false);
  const [editMode, setEditMode] = useState(false);
  const [progressEx, setProgressEx] = useState(null);
  const [filterPeriod, setFilterPeriod] = useState("all");
  const [detailSession, setDetailSession] = useState(null);
  const timerRef = useRef();
 
  useEffect(()=>{
    DB.get("gym_custom_blocks",{}).then(setCustomBlocks);
  },[]);
 
  useEffect(()=>{
    if (running){timerRef.current=setInterval(()=>setTimer(t=>t+1),1000);}
    else clearInterval(timerRef.current);
    return()=>clearInterval(timerRef.current);
  },[running]);
 
  useEffect(()=>{
    if (restActive&&restSecs>0){const id=setTimeout(()=>setRestSecs(s=>s-1),1000);return()=>clearTimeout(id);}
    else if(restSecs===0) setRestActive(false);
  },[restActive,restSecs]);
 
  const getBlocks = day => customBlocks[day]||WORKOUT_TEMPLATES[day].blocks;
 
  const buildLog = day => {
    const log={};
    getBlocks(day).forEach(b=>{
      log[b.id]=Array.from({length:b.sets},()=>
        Object.fromEntries(b.exercises.map(ex=>{
          const last=lastVals[day]?.[ex.name]||{};
          return [ex.name,{kg:last.kg||"",reps:last.reps||"",time:last.time||""}];
        }))
      );
    });
    return log;
  };
 
  const openDay = day => { setActiveDay(day); setSessionLog(buildLog(day)); setTimer(0); setRunning(false); setEditMode(false); setTab("log"); };
 
  const updateCell = (blockId,setIdx,exName,field,val) => {
    setSessionLog(prev=>{
      const block=[...(prev[blockId]||[])];
      block[setIdx]={...block[setIdx],[exName]:{...(block[setIdx]?.[exName]||{}),[field]:val}};
      return{...prev,[blockId]:block};
    });
  };
 
  const finishSession = async () => {
    const newLast={...lastVals,[activeDay]:{}};
    getBlocks(activeDay).forEach(b=>{
      b.exercises.forEach(ex=>{
        const sets=sessionLog[b.id]||[];
        for(let i=sets.length-1;i>=0;i--){
          const v=sets[i]?.[ex.name];
          if(v&&(v.kg||v.reps||v.time)){newLast[activeDay][ex.name]={kg:v.kg||"",reps:v.reps||"",time:v.time||""};break;}
        }
      });
    });
    setLastVals(newLast); await DB.set("gym_last_vals",newLast);
    const session={id:Date.now(),date:new Date().toISOString(),dayId:activeDay,duration:timer,log:sessionLog,blocks:getBlocks(activeDay)};
    const newH=[...history,session];
    setHistory(newH); await DB.set("gym_history",newH);
    setRunning(false); setActiveDay(null); setTab("history");
  };
 
  const deleteBlock = async (day,blockId) => {
    const blocks=getBlocks(day).filter(b=>b.id!==blockId);
    const updated={...customBlocks,[day]:blocks};
    setCustomBlocks(updated); await DB.set("gym_custom_blocks",updated);
  };
  const moveBlock = async (day,blockId,dir) => {
    const blocks=[...getBlocks(day)];
    const idx=blocks.findIndex(b=>b.id===blockId),ni=idx+dir;
    if(ni<0||ni>=blocks.length)return;
    [blocks[idx],blocks[ni]]=[blocks[ni],blocks[idx]];
    const updated={...customBlocks,[day]:blocks};
    setCustomBlocks(updated); await DB.set("gym_custom_blocks",updated);
  };
  const deleteSession = async id => {
    const newH=history.filter(h=>h.id!==id);
    setHistory(newH); await DB.set("gym_history",newH);
    if(detailSession?.id===id) setDetailSession(null);
  };
 
  // Progress data
  const getProgressData = (exName, period="all") => {
    let data = history.flatMap(sess=>{
      const blocks=sess.blocks||getBlocks(sess.dayId);
      const block=blocks.find(b=>b.exercises.some(e=>e.name===exName));
      if(!block)return[];
      let max=0;
      (sess.log?.[block.id]||[]).forEach(row=>{const k=parseFloat(row?.[exName]?.kg);if(!isNaN(k)&&k>max)max=k;});
      return max>0?[{date:sess.date,v:max}]:[];
    });
    if (period==="week") { const w=thisWeekStart(); data=data.filter(d=>new Date(d.date)>=w); }
    else if (period==="month") { const m=new Date(); m.setDate(1); m.setHours(0,0,0,0); data=data.filter(d=>new Date(d.date)>=m); }
    return data;
  };
 
  const getVolumeData = (period="all") => {
    let data=history.map(s=>({date:s.date,v:sessionVolume(s.log)}));
    if(period==="month"){const m=new Date();m.setDate(1);m.setHours(0,0,0,0);data=data.filter(d=>new Date(d.date)>=m);}
    return data;
  };
 
  const freqData = () => {
    const months={};
    history.forEach(s=>{
      const k=new Date(s.date).toLocaleDateString("en-GB",{month:"short",year:"2-digit"});
      months[k]=(months[k]||0)+1;
    });
    return Object.entries(months).slice(-6).map(([k,v])=>({label:k.split(" ")[0],v}));
  };
 
  // Comparison data for current session vs previous
  const getPrevSessionForDay = day => [...history].reverse().find(h=>h.dayId===day);
 
  // ── PLAN TAB
  if (tab==="plan") return (
    <div style={{paddingBottom:20}}>
      <div style={{display:"flex",gap:8,marginBottom:16,flexWrap:"wrap"}}>
        <Tag color={C}>{history.length} SESSIONS</Tag>
        {history.length>0&&<Tag color={C}>LAST: {fmtShort([...history].pop().date)}</Tag>}
      </div>
      {Object.entries(WORKOUT_TEMPLATES).map(([day,w])=>{
        const blocks=getBlocks(Number(day)),done=history.filter(h=>h.dayId==day).length;
        const lastS=getPrevSessionForDay(Number(day));
        return (
          <Card key={day} onClick={()=>openDay(Number(day))} style={{transition:"border-color .2s",cursor:"pointer"}}
            onMouseEnter={e=>e.currentTarget.style.borderColor=C} onMouseLeave={e=>e.currentTarget.style.borderColor="#1e1e1e"}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
              <div>
                <div style={{fontSize:9,color:C,fontFamily:"'DM Mono',monospace",letterSpacing:3,marginBottom:3}}>{w.label} · {done}× done</div>
                <div style={{fontSize:17,fontWeight:700,color:"#fff",fontFamily:"'Outfit',sans-serif"}}>{w.title}</div>
                <div style={{fontSize:11,color:"#444",fontFamily:"'DM Mono',monospace",marginTop:3}}>
                  {blocks.reduce((a,b)=>a+b.sets,0)} sets · {blocks.length} blocks
                </div>
                {lastS&&<div style={{fontSize:10,color:"#555",fontFamily:"'DM Mono',monospace",marginTop:2}}>Last: {fmtShort(lastS.date)} · {sessionVolume(lastS.log).toLocaleString()} kg·rep</div>}
              </div>
              <div style={{width:34,height:34,borderRadius:"50%",background:C+"22",border:`1px solid ${C}44`,
                display:"flex",alignItems:"center",justifyContent:"center",color:C,fontSize:16}}>→</div>
            </div>
          </Card>
        );
      })}
    </div>
  );
 
  // ── LOG TAB
  if (tab==="log"&&activeDay) {
    const w=WORKOUT_TEMPLATES[activeDay],blocks=getBlocks(activeDay);
    const prevSess=getPrevSessionForDay(activeDay);
    return (
      <div style={{paddingBottom:20}}>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:14}}>
          <button onClick={()=>{setActiveDay(null);setRunning(false);setTimer(0);setTab("plan");}}
            style={{background:"none",border:"none",color:"#555",cursor:"pointer",fontSize:18,padding:0}}>←</button>
          <div style={{flex:1}}>
            <div style={{fontSize:9,color:C,fontFamily:"'DM Mono',monospace",letterSpacing:3}}>{w.label}</div>
            <div style={{fontSize:16,fontWeight:700,color:"#fff",fontFamily:"'Outfit',sans-serif"}}>{w.title}</div>
            {prevSess&&<div style={{fontSize:10,color:"#555",fontFamily:"'DM Mono',monospace"}}>vs {fmtShort(prevSess.date)}</div>}
          </div>
          <div style={{display:"flex",gap:6,alignItems:"center"}}>
            <button onClick={()=>setEditMode(e=>!e)}
              style={{background:editMode?"#1a1a1a":"none",border:`1px solid ${editMode?C:"#333"}`,color:editMode?C:"#555",
                fontFamily:"'DM Mono',monospace",fontSize:10,padding:"4px 8px",borderRadius:6,cursor:"pointer"}}>{editMode?"DONE":"EDIT"}</button>
            <div style={{fontFamily:"'DM Mono',monospace",fontSize:14,color:running?C:"#555",cursor:"pointer",minWidth:48,textAlign:"right"}}
              onClick={()=>setRunning(r=>!r)}>{fmt(timer)}</div>
          </div>
        </div>
 
        {!running&&timer===0
          ?<Btn color={C} filled onClick={()=>setRunning(true)} style={{width:"100%",marginBottom:12}}>▶ START SESSION</Btn>
          :<div style={{display:"flex",gap:8,marginBottom:10}}>
            <Btn color={C} onClick={()=>setRunning(r=>!r)} style={{flex:1}}>{running?"⏸ PAUSE":"▶ RESUME"}</Btn>
            {[60,90,120].map(s=>(
              <button key={s} onClick={()=>{setRestSecs(s);setRestActive(true);}}
                style={{background:"#111",border:"1px solid #2a2a2a",color:restActive?C:"#555",
                  fontFamily:"'DM Mono',monospace",fontSize:11,fontWeight:700,padding:"6px 10px",borderRadius:8,cursor:"pointer"}}>
                {restActive&&restSecs>0?`${restSecs}s`:s+"s"}
              </button>
            ))}
          </div>
        }
        {restActive&&restSecs>0&&(
          <div style={{background:C+"11",border:`1px solid ${C}33`,borderRadius:10,padding:"8px 14px",marginBottom:10,
            fontFamily:"'DM Mono',monospace",fontSize:13,color:C,textAlign:"center"}}>REST — {fmt(restSecs)}</div>
        )}
 
        {blocks.map((block,bIdx)=>{
          const blockLog=sessionLog[block.id]||[];
          return (
            <Card key={block.id}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                <span style={{background:C,color:"#000",fontFamily:"'DM Mono',monospace",fontSize:10,fontWeight:700,padding:"2px 8px",borderRadius:4}}>{block.sets}×</span>
                <span style={{color:"#fff",fontSize:13,fontFamily:"'Outfit',sans-serif",fontWeight:600,flex:1}}>{block.exercises.map(e=>e.name).join(" / ")}</span>
                {editMode&&<div style={{display:"flex",gap:4}}>
                  <button onClick={()=>moveBlock(activeDay,block.id,-1)} disabled={bIdx===0}
                    style={{background:"#161616",border:"1px solid #2a2a2a",color:bIdx===0?"#333":"#666",borderRadius:4,cursor:"pointer",padding:"2px 7px",fontSize:12}}>↑</button>
                  <button onClick={()=>moveBlock(activeDay,block.id,1)} disabled={bIdx===blocks.length-1}
                    style={{background:"#161616",border:"1px solid #2a2a2a",color:bIdx===blocks.length-1?"#333":"#666",borderRadius:4,cursor:"pointer",padding:"2px 7px",fontSize:12}}>↓</button>
                  <button onClick={()=>deleteBlock(activeDay,block.id)}
                    style={{background:"#1a0a0a",border:"1px solid #3a1a1a",color:"#FF4D4D",borderRadius:4,cursor:"pointer",padding:"2px 7px",fontSize:11}}>✕</button>
                </div>}
              </div>
 
              {/* Column headers */}
              <div style={{display:"flex",gap:6,paddingLeft:24,marginBottom:4}}>
                {block.exercises.flatMap(ex=>ex.type==="weighted"?["kg","reps"]:[ex.type==="time"?"sec":"reps"])
                  .map((h,i)=><div key={i} style={{flex:1,fontSize:9,color:"#333",fontFamily:"'DM Mono',monospace",textAlign:"center",letterSpacing:1}}>{h}</div>)}
                {prevSess&&<div style={{width:72,fontSize:9,color:"#333",fontFamily:"'DM Mono',monospace",textAlign:"center",letterSpacing:1}}>PREV / DIFF</div>}
              </div>
 
              {Array.from({length:block.sets}).map((_,setIdx)=>{
                const row=blockLog[setIdx]||{};
                const prevRow=(prevSess?.log?.[block.id]||[])[setIdx];
                return (
                  <div key={setIdx} style={{display:"flex",gap:6,padding:"5px 0",borderBottom:"1px solid #1a1a1a",alignItems:"center"}}>
                    <span style={{color:"#444",fontSize:11,fontFamily:"'DM Mono',monospace",minWidth:20}}>S{setIdx+1}</span>
                    {block.exercises.map(ex=>{
                      const val=row[ex.name]||{};
                      const up=(f,v)=>updateCell(block.id,setIdx,ex.name,f,v);
                      return (
                        <div key={ex.name} style={{flex:1,display:"flex",gap:4}}>
                          {ex.type==="weighted"&&<>
                            <input type="number" placeholder="kg" value={val.kg||""} style={iSt} onChange={e=>up("kg",e.target.value)}/>
                            <input type="number" placeholder="reps" value={val.reps||""} style={iSt} onChange={e=>up("reps",e.target.value)}/>
                          </>}
                          {ex.type==="reps"&&<input type="number" placeholder="reps" value={val.reps||""} style={{...iSt,flex:2}} onChange={e=>up("reps",e.target.value)}/>}
                          {ex.type==="time"&&<input type="number" placeholder="sec" value={val.time||""} style={{...iSt,flex:2}} onChange={e=>up("time",e.target.value)}/>}
                        </div>
                      );
                    })}
                    {prevSess&&(
                      <div style={{width:72,textAlign:"center"}}>
                        {block.exercises.map(ex=>{
                          const pv=prevRow?.[ex.name];
                          const cv=row[ex.name];
                          if(!pv)return null;
                          const prevTxt=ex.type==="weighted"?(pv.kg&&pv.reps?`${pv.kg}×${pv.reps}`:""):(pv.reps||pv.time||"");
                          // diff
                          let diff=null;
                          if(ex.type==="weighted"&&cv?.kg&&pv?.kg){
                            const d=(parseFloat(cv.kg)-parseFloat(pv.kg));
                            if(!isNaN(d)&&d!==0) diff={v:d,pos:d>0};
                          }
                          return (
                            <div key={ex.name}>
                              <div style={{fontSize:9,color:"#444",fontFamily:"'DM Mono',monospace"}}>{prevTxt}</div>
                              {diff&&<div style={{fontSize:9,fontFamily:"'DM Mono',monospace",color:diff.pos?"#00C875":"#FF4D4D",fontWeight:700}}>
                                {diff.pos?"+":""}{diff.v}
                              </div>}
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                );
              })}
            </Card>
          );
        })}
        <Btn color="#00C875" filled onClick={finishSession} style={{width:"100%",marginTop:8}}>✓ FINISH & SAVE</Btn>
      </div>
    );
  }
 
  // ── HISTORY TAB
  if (tab==="history") {
    // Detail view
    if (detailSession) {
      const w=WORKOUT_TEMPLATES[detailSession.dayId];
      const blocks=detailSession.blocks||getBlocks(detailSession.dayId);
      // Find previous session before this one for the same day
      const idx=history.findIndex(h=>h.id===detailSession.id);
      const prevForDay=[...history].slice(0,idx).reverse().find(h=>h.dayId===detailSession.dayId);
      return (
        <div style={{paddingBottom:20}}>
          <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:16}}>
            <button onClick={()=>setDetailSession(null)}
              style={{background:"none",border:"none",color:"#555",cursor:"pointer",fontSize:18,padding:0}}>←</button>
            <div style={{flex:1}}>
              <div style={{fontSize:9,color:C,fontFamily:"'DM Mono',monospace",letterSpacing:3}}>{w?.label} · {fmtDate(detailSession.date)}</div>
              <div style={{fontSize:16,fontWeight:700,color:"#fff",fontFamily:"'Outfit',sans-serif"}}>{w?.title}</div>
              {detailSession.duration>0&&<div style={{fontSize:11,color:"#555",fontFamily:"'DM Mono',monospace"}}>Duration: {fmt(detailSession.duration)}</div>}
            </div>
            <button onClick={()=>deleteSession(detailSession.id)}
              style={{background:"#1a0a0a",border:"1px solid #3a1a1a",color:"#FF4D4D",borderRadius:8,cursor:"pointer",padding:"6px 12px",fontSize:11,fontFamily:"'DM Mono',monospace"}}>DELETE</button>
          </div>
          <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap"}}>
            <Tag color={C}>{sessionVolume(detailSession.log).toLocaleString()} kg·rep</Tag>
            <Tag color={C}>TOP: {sessionMaxKg(detailSession.log)} kg</Tag>
            {prevForDay&&<Tag color="#555">vs {fmtShort(prevForDay.date)}</Tag>}
          </div>
          {blocks.map(block=>{
            const sets=detailSession.log?.[block.id]||[];
            const prevSets=prevForDay?.log?.[block.id]||[];
            return (
              <Card key={block.id}>
                <div style={{fontSize:12,fontWeight:700,color:"#fff",fontFamily:"'Outfit',sans-serif",marginBottom:10}}>
                  {block.exercises.map(e=>e.name).join(" / ")}
                </div>
                {sets.map((row,si)=>(
                  <div key={si} style={{display:"flex",gap:8,padding:"5px 0",borderBottom:"1px solid #1a1a1a",alignItems:"center"}}>
                    <span style={{color:"#444",fontSize:11,fontFamily:"'DM Mono',monospace",minWidth:20}}>S{si+1}</span>
                    {block.exercises.map(ex=>{
                      const v=row?.[ex.name]||{};
                      const pv=prevSets[si]?.[ex.name];
                      const curr=ex.type==="weighted"?(v.kg&&v.reps?`${v.kg} kg × ${v.reps}`:"—"):(v.reps||v.time||"—");
                      const prev=pv?(ex.type==="weighted"?(pv.kg&&pv.reps?`${pv.kg}×${pv.reps}`:""):(pv.reps||pv.time||"")):"";
                      let diff=null;
                      if(ex.type==="weighted"&&v.kg&&pv?.kg){const d=parseFloat(v.kg)-parseFloat(pv.kg);if(!isNaN(d)&&d!==0)diff={v:d,pos:d>0};}
                      return (
                        <div key={ex.name} style={{flex:1}}>
                          <div style={{fontSize:13,color:"#fff",fontFamily:"'DM Mono',monospace",fontWeight:600}}>{curr}</div>
                          {prev&&<div style={{fontSize:10,color:"#555",fontFamily:"'DM Mono',monospace"}}>
                            prev: {prev}
                            {diff&&<span style={{color:diff.pos?"#00C875":"#FF4D4D",marginLeft:4,fontWeight:700}}>{diff.pos?"+":""}{diff.v}</span>}
                          </div>}
                        </div>
                      );
                    })}
                  </div>
                ))}
              </Card>
            );
          })}
        </div>
      );
    }
 
    return (
      <div style={{paddingBottom:20}}>
        {/* Progress charts */}
        {history.length>=2&&(
          <Card style={{marginBottom:16}}>
            <SLabel color={C}>PROGRESS CHARTS</SLabel>
            <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}}>
              {[["all","ALL"],["month","MONTH"],["week","WEEK"]].map(([k,l])=>(
                <button key={k} onClick={()=>setFilterPeriod(k)}
                  style={{padding:"4px 10px",borderRadius:6,border:`1px solid ${filterPeriod===k?C:"#2a2a2a"}`,
                    background:filterPeriod===k?C+"22":"#161616",color:filterPeriod===k?C:"#555",
                    fontFamily:"'DM Mono',monospace",fontSize:10,cursor:"pointer"}}>{l}</button>
              ))}
            </div>
            <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:12}}>
              {ALL_WEIGHTED.map(ex=>{
                const d=getProgressData(ex,filterPeriod);
                if(!d.length)return null;
                return (
                  <button key={ex} onClick={()=>setProgressEx(progressEx===ex?null:ex)}
                    style={{fontSize:10,fontFamily:"'DM Mono',monospace",padding:"4px 10px",borderRadius:6,cursor:"pointer",
                      border:`1px solid ${progressEx===ex?C:"#2a2a2a"}`,background:progressEx===ex?C+"22":"#161616",color:progressEx===ex?C:"#555"}}>
                    {ex}
                  </button>
                );
              })}
            </div>
            {progressEx&&(()=>{
              const d=getProgressData(progressEx,filterPeriod);
              const first=d[0]?.v,last=d[d.length-1]?.v;
              const pct=first?((last-first)/first*100).toFixed(1):null;
              const pr=Math.max(...d.map(x=>x.v));
              return (
                <div>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                    <div style={{fontSize:13,color:"#fff",fontFamily:"'Outfit',sans-serif",fontWeight:600}}>{progressEx}</div>
                    <div style={{display:"flex",gap:6,alignItems:"center"}}>
                      <Tag color={C}>PR: {pr} kg</Tag>
                      {pct&&<span style={{fontSize:11,fontFamily:"'DM Mono',monospace",fontWeight:700,
                        color:parseFloat(pct)>=0?"#00C875":"#FF4D4D",background:parseFloat(pct)>=0?"rgba(0,200,117,.12)":"rgba(255,77,77,.12)",
                        padding:"2px 8px",borderRadius:4}}>{parseFloat(pct)>=0?"+":""}{pct}%</span>}
                    </div>
                  </div>
                  <LineChart data={d} color={C} yLabel="kg"/>
                </div>
              );
            })()}
            {!progressEx&&(
              <div>
                <div style={{color:"#555",fontSize:10,fontFamily:"'DM Mono',monospace",marginBottom:10}}>TRAINING VOLUME OVER TIME</div>
                <LineChart data={getVolumeData(filterPeriod)} color={C} yLabel="vol"/>
                <div style={{color:"#555",fontSize:10,fontFamily:"'DM Mono',monospace",marginTop:14,marginBottom:10}}>SESSIONS PER MONTH</div>
                <BarChart data={freqData()} color={C}/>
              </div>
            )}
          </Card>
        )}
 
        {/* Session list */}
        <SLabel color={C} style={{marginTop:4}}>SESSION LOG</SLabel>
        {[...history].reverse().map(sess=>{
          const w=WORKOUT_TEMPLATES[sess.dayId];
          return (
            <Card key={sess.id} onClick={()=>setDetailSession(sess)}
              style={{cursor:"pointer",transition:"border-color .15s"}}
              onMouseEnter={e=>e.currentTarget.style.borderColor=C}
              onMouseLeave={e=>e.currentTarget.style.borderColor="#1e1e1e"}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                <div>
                  <Tag color={C}>{w?.label}</Tag>
                  <div style={{fontSize:14,fontWeight:700,color:"#fff",fontFamily:"'Outfit',sans-serif",marginTop:4}}>{w?.title}</div>
                  <div style={{fontSize:10,color:"#444",fontFamily:"'DM Mono',monospace",marginTop:2}}>
                    {fmtDate(sess.date)}{sess.duration>0&&` · ${fmt(sess.duration)}`}
                  </div>
                </div>
                <div style={{textAlign:"right"}}>
                  <div style={{color:C,fontSize:15,fontFamily:"'DM Mono',monospace",fontWeight:700}}>{sessionVolume(sess.log).toLocaleString()}</div>
                  <div style={{fontSize:9,color:"#444",fontFamily:"'DM Mono',monospace"}}>kg·rep</div>
                  <div style={{fontSize:10,color:"#666",fontFamily:"'DM Mono',monospace",marginTop:2}}>top {sessionMaxKg(sess.log)} kg</div>
                </div>
              </div>
            </Card>
          );
        })}
        {history.length===0&&<Empty>FINISH A WORKOUT TO SEE HISTORY</Empty>}
      </div>
    );
  }
  return null;
}
 
// ─── FOOD SECTION ─────────────────────────────────────────────────────────────
function FoodSection() {
  const C = COLORS.food;
  const [loaded, setLoaded] = useState(false);
  const [tab, setTab] = useState("log");
  const [meals, setMeals] = useState([]);
  const [grocery, setGrocery] = useState([]);
  const [selectedDate, setSelectedDate] = useState(today());
  const [showAdd, setShowAdd] = useState(false);
  const [editId, setEditId] = useState(null);
  const [newMeal, setNewMeal] = useState({mealType:"Breakfast",name:"",notes:"",protein:"",carbs:"",fat:"",calories:""});
  const [newItem, setNewItem] = useState("");
  const [recentOpen, setRecentOpen] = useState(false);
 
  useEffect(()=>{
    Promise.all([DB.get("food_meals",[]),DB.get("food_grocery",[])]).then(([m,g])=>{setMeals(m);setGrocery(g);setLoaded(true);});
  },[]);
 
  const saveMeals  = async m => { setMeals(m);   await DB.set("food_meals",m); };
  const saveGrocery= async g => { setGrocery(g); await DB.set("food_grocery",g); };
 
  const addMeal = async () => {
    if (!newMeal.name.trim()) return;
    const cal = newMeal.calories || EST_CALS[newMeal.mealType] || "";
    // Auto-calc cals from macros if provided
    const autoCal = newMeal.protein&&newMeal.carbs&&newMeal.fat
      ? Math.round(parseFloat(newMeal.protein)*4+parseFloat(newMeal.carbs)*4+parseFloat(newMeal.fat)*9) : null;
    const m={...newMeal,calories:cal||(autoCal||""),id:editId||Date.now(),date:selectedDate};
    if(editId){await saveMeals(meals.map(x=>x.id===editId?m:x));setEditId(null);}
    else await saveMeals([...meals,m]);
    setNewMeal({mealType:"Breakfast",name:"",notes:"",protein:"",carbs:"",fat:"",calories:""});
    setShowAdd(false);
  };
 
  const deleteMeal = id => saveMeals(meals.filter(m=>m.id!==id));
  const startEdit  = meal => { setNewMeal({...meal}); setEditId(meal.id); setShowAdd(true); };
 
  const reuseFromDate = (meal) => {
    setNewMeal({mealType:meal.mealType,name:meal.name,notes:meal.notes||"",
      protein:meal.protein||"",carbs:meal.carbs||"",fat:meal.fat||"",calories:meal.calories||""});
    setShowAdd(true); setRecentOpen(false);
  };
 
  const addGrocery = async ()=>{ if(!newItem.trim())return; await saveGrocery([...grocery,{id:Date.now(),text:newItem.trim(),checked:false}]); setNewItem(""); };
  const toggleG = id => saveGrocery(grocery.map(g=>g.id===id?{...g,checked:!g.checked}:g));
  const deleteG = id => saveGrocery(grocery.filter(g=>g.id!==id));
 
  // Date navigation
  const navDate = (delta) => {
    const d=new Date(selectedDate); d.setDate(d.getDate()+delta);
    setSelectedDate(d.toISOString().split("T")[0]);
  };
 
  const dayMeals=meals.filter(m=>m.date===selectedDate).sort((a,b)=>MEAL_TYPES.indexOf(a.mealType)-MEAL_TYPES.indexOf(b.mealType));
  const totals={cal:0,prot:0,carbs:0,fat:0};
  dayMeals.forEach(m=>{totals.cal+=parseFloat(m.calories)||0;totals.prot+=parseFloat(m.protein)||0;totals.carbs+=parseFloat(m.carbs)||0;totals.fat+=parseFloat(m.fat)||0;});
 
  // Recent unique meal names for quick add
  const recentMeals=[...meals].reverse().filter((m,i,a)=>a.findIndex(x=>x.name===m.name)===i).slice(0,8);
 
  // Nutrition history data
  const calHistory = (() => {
    const days=[];
    for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(d.toISOString().split("T")[0]);}
    return days.map(d=>({date:d,v:meals.filter(m=>m.date===d).reduce((a,m)=>a+(parseFloat(m.calories)||0),0)})).filter(d=>d.v>0);
  })();
  const protHistory = (() => {
    const days=[];
    for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(d.toISOString().split("T")[0]);}
    return days.map(d=>({date:d,v:meals.filter(m=>m.date===d).reduce((a,m)=>a+(parseFloat(m.protein)||0),0)})).filter(d=>d.v>0);
  })();
 
  const taS={width:"100%",background:"#161616",border:"1px solid #2a2a2a",borderRadius:8,color:"#ccc",
    fontSize:12,fontFamily:"'Outfit',sans-serif",padding:"8px 10px",outline:"none",resize:"vertical",minHeight:44,boxSizing:"border-box"};
 
  if (!loaded) return <Loader/>;
  return (
    <div style={{paddingBottom:20}}>
      <Tabs tabs={[["log","MEAL LOG"],["analytics","ANALYTICS"],["grocery","GROCERY"]]} active={tab} onChange={setTab} color={C}/>
 
      {tab==="log"&&(<div>
        {/* Date nav */}
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
          <button onClick={()=>navDate(-1)} style={{background:"none",border:"1px solid #2a2a2a",color:"#666",borderRadius:8,padding:"6px 12px",cursor:"pointer",fontSize:16}}>‹</button>
          <div style={{textAlign:"center"}}>
            <div style={{fontSize:14,fontWeight:700,color:"#fff",fontFamily:"'Outfit',sans-serif"}}>
              {selectedDate===today()?"Today":new Date(selectedDate).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"short"})}
            </div>
            {selectedDate!==today()&&<div style={{fontSize:10,color:"#444",fontFamily:"'DM Mono',monospace"}}>{selectedDate}</div>}
          </div>
          <button onClick={()=>navDate(1)} disabled={selectedDate>=today()}
            style={{background:"none",border:"1px solid #2a2a2a",color:selectedDate>=today()?"#2a2a2a":"#666",borderRadius:8,padding:"6px 12px",cursor:"pointer",fontSize:16}}>›</button>
        </div>
 
        {/* Totals */}
        {dayMeals.length>0&&(
          <Card style={{marginBottom:12,padding:"12px 14px"}}>
            <SLabel color={C}>DAILY TOTALS</SLabel>
            <div style={{display:"flex",gap:8}}>
              {[["KCAL",Math.round(totals.cal),C],["PROTEIN",`${Math.round(totals.prot)}g`,C],
                ["CARBS",`${Math.round(totals.carbs)}g`,"#FFB800"],["FAT",`${Math.round(totals.fat)}g`,"#FF6B6B"]].map(([l,v,c])=>(
                <div key={l} style={{flex:1,textAlign:"center"}}>
                  <div style={{fontSize:16,fontWeight:700,color:c,fontFamily:"'DM Mono',monospace"}}>{v||"—"}</div>
                  <div style={{fontSize:8,color:"#444",fontFamily:"'DM Mono',monospace",letterSpacing:1}}>{l}</div>
                </div>
              ))}
            </div>
          </Card>
        )}
 
        <div style={{display:"flex",gap:8,marginBottom:12}}>
          <Btn color={C} filled onClick={()=>{setShowAdd(true);setEditId(null);setNewMeal({mealType:"Breakfast",name:"",notes:"",protein:"",carbs:"",fat:"",calories:""}); }} style={{flex:1}}>+ LOG MEAL</Btn>
          <Btn color={C} onClick={()=>setRecentOpen(r=>!r)} small>RECENT</Btn>
        </div>
 
        {recentOpen&&recentMeals.length>0&&(
          <Card style={{marginBottom:12}}>
            <SLabel color={C}>QUICK ADD FROM HISTORY</SLabel>
            {recentMeals.map(m=>(
              <div key={m.id} onClick={()=>reuseFromDate(m)}
                style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 0",
                  borderBottom:"1px solid #1a1a1a",cursor:"pointer"}}>
                <div>
                  <div style={{fontSize:13,color:"#ccc",fontFamily:"'Outfit',sans-serif"}}>{m.name}</div>
                  <div style={{fontSize:9,color:"#555",fontFamily:"'DM Mono',monospace"}}>{m.mealType} · {m.calories||EST_CALS[m.mealType]} kcal</div>
                </div>
                <span style={{color:C,fontSize:18}}>+</span>
              </div>
            ))}
          </Card>
        )}
 
        {showAdd&&(
          <Card style={{marginBottom:12}}>
            <SLabel color={C}>{editId?"EDIT MEAL":"LOG MEAL"}</SLabel>
            <select value={newMeal.mealType} onChange={e=>setNewMeal({...newMeal,mealType:e.target.value})}
              style={{...iSt,width:"100%",flex:"unset",background:"#161616",height:32,textAlign:"left",padding:"0 8px",marginBottom:8}}>
              {MEAL_TYPES.map(t=><option key={t} value={t}>{t}</option>)}
            </select>
            <input placeholder="What did you eat?" value={newMeal.name} onChange={e=>setNewMeal({...newMeal,name:e.target.value})}
              style={{...iSt,width:"100%",flex:"unset",background:"#161616",marginBottom:8,textAlign:"left",padding:"8px 10px"}}/>
            <textarea placeholder="Notes (optional)" value={newMeal.notes} onChange={e=>setNewMeal({...newMeal,notes:e.target.value})}
              style={{...taS,marginBottom:8}}/>
            <div style={{display:"flex",gap:6,marginBottom:6}}>
              {[["protein","Protein (g)",C],["carbs","Carbs (g)","#FFB800"],["fat","Fat (g)","#FF6B6B"],["calories","Calories","#888"]].map(([k,p,c])=>(
                <div key={k} style={{flex:1}}>
                  <div style={{fontSize:8,color:c,fontFamily:"'DM Mono',monospace",marginBottom:3,letterSpacing:1}}>{p.toUpperCase()}</div>
                  <input type="number" placeholder="—" value={newMeal[k]} onChange={e=>setNewMeal({...newMeal,[k]:e.target.value})}
                    style={{...iSt,width:"100%",flex:"unset",background:"#161616",fontSize:12}}/>
                </div>
              ))}
            </div>
            <div style={{fontSize:9,color:"#333",fontFamily:"'DM Mono',monospace",marginBottom:8}}>Leave blank for auto-estimate · Macros auto-calculate calories</div>
            <div style={{display:"flex",gap:8}}>
              <Btn color={C} filled onClick={addMeal} style={{flex:1}}>{editId?"SAVE":"ADD"}</Btn>
              <Btn color="#444" onClick={()=>{setShowAdd(false);setEditId(null);}} style={{flex:1}}>CANCEL</Btn>
            </div>
          </Card>
        )}
 
        {dayMeals.map(meal=>(
          <div key={meal.id} style={{background:"#0d0d0d",border:"1px solid #1e1e1e",borderRadius:10,padding:"10px 14px",marginBottom:6}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
              <div style={{flex:1}}>
                <div style={{fontSize:9,color:"#444",fontFamily:"'DM Mono',monospace",letterSpacing:1,marginBottom:2}}>
                  {meal.mealType.toUpperCase()}
                  {meal.calories&&<span style={{color:C,marginLeft:8}}>{meal.calories} kcal</span>}
                  {meal.protein&&<span style={{color:"#888",marginLeft:6}}>{meal.protein}g P</span>}
                  {meal.carbs&&<span style={{color:"#FFB80088",marginLeft:6}}>{meal.carbs}g C</span>}
                  {meal.fat&&<span style={{color:"#FF6B6B88",marginLeft:6}}>{meal.fat}g F</span>}
                </div>
                <div style={{fontSize:14,color:"#fff",fontFamily:"'Outfit',sans-serif",fontWeight:600}}>{meal.name}</div>
                {meal.notes&&<div style={{fontSize:11,color:"#555",fontFamily:"'Outfit',sans-serif",marginTop:2,lineHeight:1.4}}>{meal.notes}</div>}
              </div>
              <div style={{display:"flex",gap:4,marginLeft:8}}>
                <button onClick={()=>startEdit(meal)} style={{background:"none",border:"none",color:"#444",cursor:"pointer",fontSize:14,padding:"0 3px"}}>✎</button>
                <button onClick={()=>deleteMeal(meal.id)} style={{background:"none",border:"none",color:"#333",cursor:"pointer",fontSize:16,padding:"0 3px"}}>×</button>
              </div>
            </div>
          </div>
        ))}
        {dayMeals.length===0&&!showAdd&&<Empty>NO MEALS LOGGED</Empty>}
      </div>)}
 
      {tab==="analytics"&&(
        <div>
          <SLabel color={C}>CALORIES — LAST 14 DAYS</SLabel>
          {calHistory.length>=2?<LineChart data={calHistory} color={C} yLabel="kcal" height={90}/>:<Empty>LOG MEALS TO SEE TRENDS</Empty>}
          <SLabel color={C} style={{marginTop:16}}>PROTEIN — LAST 14 DAYS</SLabel>
          {protHistory.length>=2?<LineChart data={protHistory} color="#00C875" yLabel="g" height={80}/>:<Empty>ADD PROTEIN TO SEE TRENDS</Empty>}
          {calHistory.length>0&&(()=>{
            const avg=Math.round(calHistory.reduce((a,d)=>a+d.v,0)/calHistory.length);
            const maxDay=calHistory.reduce((a,b)=>b.v>a.v?b:a);
            return (
              <Card style={{marginTop:16}}>
                <SLabel color={C}>AVERAGES</SLabel>
                <div style={{display:"flex",gap:8}}>
                  <div style={{flex:1,textAlign:"center"}}>
                    <div style={{fontSize:20,fontWeight:700,color:C,fontFamily:"'DM Mono',monospace"}}>{avg}</div>
                    <div style={{fontSize:9,color:"#444",fontFamily:"'DM Mono',monospace",marginTop:2}}>AVG KCAL/DAY</div>
                  </div>
                  <div style={{flex:1,textAlign:"center"}}>
                    <div style={{fontSize:20,fontWeight:700,color:C,fontFamily:"'DM Mono',monospace"}}>{maxDay.v}</div>
                    <div style={{fontSize:9,color:"#444",fontFamily:"'DM Mono',monospace",marginTop:2}}>HIGHEST DAY</div>
                  </div>
                </div>
              </Card>
            );
          })()}
        </div>
      )}
 
      {tab==="grocery"&&(
        <div>
          <div style={{display:"flex",gap:8,marginBottom:12,alignItems:"center"}}>
            {grocery.filter(g=>!g.checked).length>0&&<Tag color={C}>{grocery.filter(g=>!g.checked).length} left</Tag>}
            {grocery.some(g=>g.checked)&&<Btn color="#444" small onClick={()=>saveGrocery(grocery.filter(g=>!g.checked))}>CLEAR DONE</Btn>}
          </div>
          <div style={{display:"flex",gap:8,marginBottom:12}}>
            <input placeholder="Add item... (e.g. Chicken breast 500g)" value={newItem}
              onChange={e=>setNewItem(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addGrocery()}
              style={{...iSt,flex:1,textAlign:"left",padding:"10px 12px",width:"unset",background:"#161616",borderRadius:8}}/>
            <Btn color={C} filled onClick={addGrocery} small>ADD</Btn>
          </div>
          {grocery.map(item=>(
            <div key={item.id} onClick={()=>toggleG(item.id)}
              style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",
                background:item.checked?"#0a1a0a":"#0d0d0d",border:`1px solid ${item.checked?C+"33":"#1e1e1e"}`,
                borderRadius:8,marginBottom:4,cursor:"pointer"}}>
              <div style={{width:18,height:18,borderRadius:5,border:`1.5px solid ${item.checked?C:"#333"}`,
                background:item.checked?C:"none",display:"flex",alignItems:"center",justifyContent:"center",
                flexShrink:0,fontSize:11,color:"#000",fontWeight:700}}>{item.checked?"✓":""}</div>
              <span style={{flex:1,fontSize:14,color:item.checked?"#444":"#ccc",fontFamily:"'Outfit',sans-serif",
                textDecoration:item.checked?"line-through":"none"}}>{item.text}</span>
              <button onClick={e=>{e.stopPropagation();deleteG(item.id);}}
                style={{background:"none",border:"none",color:"#333",cursor:"pointer",fontSize:16,padding:"0 4px"}}>×</button>
            </div>
          ))}
          {grocery.length===0&&<Empty>YOUR LIST IS EMPTY</Empty>}
        </div>
      )}
    </div>
  );
}
 
// ─── PADEL SECTION ────────────────────────────────────────────────────────────
function PadelSection({ games, setGames }) {
  const C = COLORS.padel;
  const [loaded, setLoaded] = useState(false);
  const [tab, setTab] = useState("skills");
  const [skills, setSkills] = useState([]);
  const [showAddGame, setShowAddGame] = useState(false);
  const [showAddSkill, setShowAddSkill] = useState(false);
  const [newSkill, setNewSkill] = useState({title:"",note:"",category:"Shots"});
  const [newGame, setNewGame] = useState({result:"",partner:"",opponent:"",score:"",notes:"",rating:3,duration:""});
  const [editSkillId, setEditSkillId] = useState(null);
  const [deleteSkillId, setDeleteSkillId] = useState(null);
  const [detailGame, setDetailGame] = useState(null);
  const cats = ["Movement","Shots","Strategy","Mental"];
 
  useEffect(()=>{
    DB.get("padel_skills",PADEL_INIT).then(sk=>{setSkills(sk);setLoaded(true);});
  },[]);
 
  const saveSkills = async s => { setSkills(s); await DB.set("padel_skills",s); };
  const saveGames  = async g => { setGames(g);  await DB.set("padel_games",g); };
 
  const addSkill = async () => {
    if (!newSkill.title.trim()) return;
    if (editSkillId){await saveSkills(skills.map(s=>s.id===editSkillId?{...s,...newSkill}:s));setEditSkillId(null);}
    else await saveSkills([...skills,{...newSkill,id:Date.now(),learned:false}]);
    setNewSkill({title:"",note:"",category:"Shots"}); setShowAddSkill(false);
  };
  const deleteSkill = async id => { await saveSkills(skills.filter(s=>s.id!==id)); setDeleteSkillId(null); };
 
  const addGame = async () => {
    if (!newGame.notes.trim()) return;
    await saveGames([...games,{...newGame,id:Date.now(),date:new Date().toISOString()}]);
    setNewGame({result:"",partner:"",opponent:"",score:"",notes:"",rating:3,duration:""});
    setShowAddGame(false);
  };
  const deleteGame = async id => { await saveGames(games.filter(g=>g.id!==id)); setDetailGame(null); };
 
  // Analytics
  const totalGames=games.length;
  const wins=games.filter(g=>g.result==="W").length;
  const losses=games.filter(g=>g.result==="L").length;
  const winRate=totalGames?Math.round(wins/totalGames*100):0;
  const totalHours=Math.round(games.reduce((a,g)=>a+(parseFloat(g.duration)||0),0)/60*10)/10;
 
  const monthlyData=()=>{
    const months={};
    games.forEach(g=>{
      const k=new Date(g.date).toLocaleDateString("en-GB",{month:"short",year:"2-digit"});
      months[k]=(months[k]||0)+1;
    });
    return Object.entries(months).slice(-6).map(([k,v])=>({label:k.split(" ")[0],v}));
  };
  const winRateData=()=>{
    const data=[];
    games.forEach((g,i)=>{
      const slice=games.slice(0,i+1);
      const w=slice.filter(x=>x.result==="W").length;
      data.push({date:g.date,v:Math.round(w/slice.length*100)});
    });
    return data;
  };
 
  const iSk={...iSt,width:"100%",flex:"unset",background:"#161616",textAlign:"left",padding:"8px 10px"};
  const taS={width:"100%",background:"#161616",border:"1px solid #2a2a2a",borderRadius:8,color:"#ccc",
    fontSize:12,fontFamily:"'Outfit',sans-serif",padding:"8px 10px",outline:"none",resize:"vertical",minHeight:60,boxSizing:"border-box"};
 
  if (!loaded) return <Loader/>;
 
  // Detail view
  if (detailGame) return (
    <div style={{paddingBottom:20}}>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:16}}>
        <button onClick={()=>setDetailGame(null)} style={{background:"none",border:"none",color:"#555",cursor:"pointer",fontSize:18,padding:0}}>←</button>
        <div style={{flex:1}}>
          <div style={{fontSize:9,color:C,fontFamily:"'DM Mono',monospace",letterSpacing:3}}>{fmtDate(detailGame.date)}</div>
          <div style={{fontSize:16,fontWeight:700,color:detailGame.result==="W"?"#00C875":detailGame.result==="L"?"#FF4D4D":"#FFB800",fontFamily:"'Outfit',sans-serif"}}>
            {detailGame.result==="W"?"WIN":detailGame.result==="L"?"LOSS":"DRAW"}
            {detailGame.score&&` — ${detailGame.score}`}
          </div>
        </div>
        <button onClick={()=>deleteGame(detailGame.id)}
          style={{background:"#1a0a0a",border:"1px solid #3a1a1a",color:"#FF4D4D",borderRadius:8,cursor:"pointer",padding:"6px 12px",fontSize:11,fontFamily:"'DM Mono',monospace"}}>DELETE</button>
      </div>
      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:16}}>
        {detailGame.partner&&<Tag color={C}>w/ {detailGame.partner}</Tag>}
        {detailGame.opponent&&<Tag color="#555">vs {detailGame.opponent}</Tag>}
        {detailGame.duration&&<Tag color={C}>{detailGame.duration} min</Tag>}
        <div style={{display:"flex",gap:2}}>{[1,2,3,4,5].map(n=>(
          <span key={n} style={{color:detailGame.rating>=n?C:"#2a2a2a",fontSize:14}}>★</span>
        ))}</div>
      </div>
      <Card>
        <SLabel color={C}>NOTES</SLabel>
        <div style={{fontSize:13,color:"#ccc",fontFamily:"'Outfit',sans-serif",lineHeight:1.7}}>{detailGame.notes}</div>
      </Card>
    </div>
  );
 
  return (
    <div style={{paddingBottom:20}}>
      <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap"}}>
        <Tag color={C}>LVL 2.4</Tag>
        <Tag color={C}>{totalGames} GAMES</Tag>
        <Tag color={C}>{wins}W {losses}L</Tag>
        {totalGames>0&&<Tag color={C}>{winRate}% WIN</Tag>}
        {totalHours>0&&<Tag color={C}>{totalHours}h PLAYED</Tag>}
      </div>
 
      <Tabs tabs={[["skills","SKILLS"],["games","GAMES"],["analytics","ANALYTICS"],["focus","FOCUS"]]} active={tab} onChange={setTab} color={C}/>
 
      {tab==="skills"&&(
        <div>
          {cats.map(cat=>{
            const items=skills.filter(s=>s.category===cat);
            if(!items.length)return null;
            return (
              <div key={cat} style={{marginBottom:14}}>
                <SLabel color={C}>{cat}</SLabel>
                {items.map(skill=>{
                  const isDel=deleteSkillId===skill.id;
                  return (
                    <div key={skill.id} style={{background:skill.learned?"#0a1520":"#0d0d0d",
                      border:`1px solid ${isDel?"#FF4D4D44":skill.learned?C+"44":"#1e1e1e"}`,
                      borderRadius:10,padding:"10px 14px",marginBottom:6}}>
                      {isDel?(
                        <div style={{display:"flex",alignItems:"center",gap:10}}>
                          <span style={{flex:1,fontSize:12,color:"#FF4D4D",fontFamily:"'Outfit',sans-serif"}}>Remove "{skill.title}"?</span>
                          <button onClick={()=>deleteSkill(skill.id)} style={{background:"#FF4D4D22",border:"1px solid #FF4D4D55",color:"#FF4D4D",fontFamily:"'DM Mono',monospace",fontSize:10,fontWeight:700,padding:"4px 12px",borderRadius:6,cursor:"pointer"}}>YES</button>
                          <button onClick={()=>setDeleteSkillId(null)} style={{background:"#161616",border:"1px solid #2a2a2a",color:"#555",fontFamily:"'DM Mono',monospace",fontSize:10,fontWeight:700,padding:"4px 12px",borderRadius:6,cursor:"pointer"}}>NO</button>
                        </div>
                      ):(
                        <div style={{display:"flex",gap:12,alignItems:"flex-start"}}>
                          <div onClick={()=>saveSkills(skills.map(s=>s.id===skill.id?{...s,learned:!s.learned}:s))}
                            style={{width:18,height:18,borderRadius:4,border:`1.5px solid ${skill.learned?C:"#333"}`,
                              background:skill.learned?C+"22":"none",flexShrink:0,marginTop:2,cursor:"pointer",
                              display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,color:C}}>
                            {skill.learned?"✓":""}
                          </div>
                          <div style={{flex:1}}>
                            <div style={{fontSize:13,color:skill.learned?"#fff":"#777",fontFamily:"'Outfit',sans-serif",fontWeight:600}}>{skill.title}</div>
                            {skill.note&&<div style={{fontSize:11,color:"#555",fontFamily:"'Outfit',sans-serif",marginTop:2,lineHeight:1.5}}>{skill.note}</div>}
                          </div>
                          <div style={{display:"flex",gap:4,flexShrink:0}}>
                            <button onClick={()=>{setNewSkill({title:skill.title,note:skill.note||"",category:skill.category});setEditSkillId(skill.id);setShowAddSkill(true);setDeleteSkillId(null);}}
                              style={{background:"none",border:"none",color:"#444",cursor:"pointer",fontSize:14,padding:"0 3px"}}>✎</button>
                            <button onClick={()=>setDeleteSkillId(skill.id)}
                              style={{background:"none",border:"none",color:"#333",cursor:"pointer",fontSize:16,padding:"0 3px"}}>×</button>
                          </div>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            );
          })}
          {!showAddSkill
            ?<Btn color={C} onClick={()=>{setShowAddSkill(true);setEditSkillId(null);setNewSkill({title:"",note:"",category:"Shots"});}} style={{width:"100%",marginTop:4}}>+ ADD SKILL</Btn>
            :<Card>
                <SLabel color={C}>{editSkillId?"EDIT":"NEW SKILL"}</SLabel>
                <select value={newSkill.category} onChange={e=>setNewSkill({...newSkill,category:e.target.value})} style={{...iSk,marginBottom:8}}>
                  {cats.map(c=><option key={c} value={c}>{c}</option>)}
                </select>
                <input placeholder="Skill name" value={newSkill.title} onChange={e=>setNewSkill({...newSkill,title:e.target.value})} style={{...iSk,marginBottom:8}}/>
                <textarea placeholder="Notes..." value={newSkill.note} onChange={e=>setNewSkill({...newSkill,note:e.target.value})} style={{...taS,marginBottom:8}}/>
                <div style={{display:"flex",gap:8}}>
                  <Btn color={C} filled onClick={addSkill} style={{flex:1}}>{editSkillId?"SAVE":"ADD"}</Btn>
                  <Btn color="#444" onClick={()=>{setShowAddSkill(false);setEditSkillId(null);}} style={{flex:1}}>CANCEL</Btn>
                </div>
              </Card>
          }
        </div>
      )}
 
      {tab==="games"&&(
        <div>
          <Btn color={C} filled onClick={()=>setShowAddGame(true)} style={{width:"100%",marginBottom:14}}>+ LOG GAME</Btn>
          {showAddGame&&(
            <Card style={{marginBottom:14}}>
              <SLabel color={C}>LOG GAME</SLabel>
              <div style={{display:"flex",gap:8,marginBottom:8}}>
                {[["W","WIN"],["L","LOSS"],["D","DRAW"]].map(([v,l])=>(
                  <button key={v} onClick={()=>setNewGame({...newGame,result:v})}
                    style={{flex:1,padding:"8px",borderRadius:8,border:`1.5px solid ${newGame.result===v?C:"#2a2a2a"}`,
                      background:newGame.result===v?C+"22":"#161616",color:newGame.result===v?C:"#555",
                      fontFamily:"'DM Mono',monospace",fontSize:11,fontWeight:700,cursor:"pointer"}}>{l}</button>
                ))}
              </div>
              <div style={{display:"flex",gap:8,marginBottom:8}}>
                <input placeholder="Score (e.g. 6-4 6-3)" value={newGame.score} onChange={e=>setNewGame({...newGame,score:e.target.value})} style={{...iSk,flex:2}}/>
                <input placeholder="Duration (min)" type="number" value={newGame.duration} onChange={e=>setNewGame({...newGame,duration:e.target.value})} style={{...iSk,flex:1}}/>
              </div>
              <div style={{display:"flex",gap:8,marginBottom:8}}>
                <input placeholder="Partner" value={newGame.partner} onChange={e=>setNewGame({...newGame,partner:e.target.value})} style={{...iSk,flex:1}}/>
                <input placeholder="Opponents" value={newGame.opponent} onChange={e=>setNewGame({...newGame,opponent:e.target.value})} style={{...iSk,flex:1}}/>
              </div>
              <div style={{display:"flex",gap:6,marginBottom:8}}>
                {[1,2,3,4,5].map(n=>(
                  <button key={n} onClick={()=>setNewGame({...newGame,rating:n})}
                    style={{flex:1,padding:"6px 0",borderRadius:6,border:`1px solid ${newGame.rating>=n?C:"#2a2a2a"}`,
                      background:newGame.rating>=n?C+"22":"#161616",color:newGame.rating>=n?C:"#444",fontSize:14,cursor:"pointer"}}>★</button>
                ))}
              </div>
              <textarea placeholder="How did you play? What worked? What to improve?" value={newGame.notes}
                onChange={e=>setNewGame({...newGame,notes:e.target.value})} style={{...taS,marginBottom:8}}/>
              <div style={{display:"flex",gap:8}}>
                <Btn color={C} filled onClick={addGame} style={{flex:1}}>SAVE</Btn>
                <Btn color="#444" onClick={()=>setShowAddGame(false)} style={{flex:1}}>CANCEL</Btn>
              </div>
            </Card>
          )}
          {[...games].reverse().map(g=>(
            <Card key={g.id} onClick={()=>setDetailGame(g)} style={{cursor:"pointer"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                <div>
                  <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:4}}>
                    <span style={{fontSize:13,fontWeight:700,fontFamily:"'DM Mono',monospace",
                      color:g.result==="W"?"#00C875":g.result==="L"?"#FF4D4D":"#FFB800"}}>
                      {g.result==="W"?"WIN":g.result==="L"?"LOSS":"DRAW"}
                    </span>
                    {g.score&&<span style={{fontSize:12,color:"#666",fontFamily:"'DM Mono',monospace"}}>{g.score}</span>}
                  </div>
                  {(g.partner||g.opponent)&&<div style={{fontSize:10,color:"#555",fontFamily:"'DM Mono',monospace",marginBottom:2}}>
                    {g.partner&&`w/ ${g.partner}`}{g.partner&&g.opponent&&" · "}{g.opponent&&`vs ${g.opponent}`}
                  </div>}
                  <div style={{fontSize:10,color:"#333",fontFamily:"'DM Mono',monospace"}}>{fmtDate(g.date)}{g.duration&&` · ${g.duration} min`}</div>
                </div>
                <div style={{display:"flex",gap:2}}>{[1,2,3,4,5].map(n=>(
                  <span key={n} style={{color:g.rating>=n?C:"#2a2a2a",fontSize:12}}>★</span>
                ))}</div>
              </div>
              {g.notes&&<div style={{fontSize:12,color:"#555",fontFamily:"'Outfit',sans-serif",marginTop:6,lineHeight:1.4,
                overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{g.notes}</div>}
            </Card>
          ))}
          {games.length===0&&!showAddGame&&<Empty>LOG YOUR FIRST GAME</Empty>}
        </div>
      )}
 
      {tab==="analytics"&&(
        <div>
          <div style={{display:"flex",gap:8,marginBottom:16}}>
            {[["MATCHES",totalGames,""],["WIN RATE",winRate+"%",""],["HOURS",totalHours,""]].map(([l,v])=>(
              <div key={l} style={{flex:1,background:"#0d0d0d",border:`1px solid ${C}22`,borderRadius:12,padding:"12px 10px",textAlign:"center"}}>
                <div style={{fontSize:22,fontWeight:700,color:C,fontFamily:"'DM Mono',monospace"}}>{v||"—"}</div>
                <div style={{fontSize:8,color:"#444",fontFamily:"'DM Mono',monospace",letterSpacing:1,marginTop:2}}>{l}</div>
              </div>
            ))}
          </div>
          <SLabel color={C}>MATCHES PER MONTH</SLabel>
          {monthlyData().length>=2?<BarChart data={monthlyData()} color={C}/>:<Empty>NEED MORE GAMES</Empty>}
          <SLabel color={C} style={{marginTop:16}}>WIN RATE OVER TIME (%)</SLabel>
          {winRateData().length>=3?<LineChart data={winRateData()} color={C} yLabel="%"/>:<Empty>NEED MORE GAMES</Empty>}
          {totalHours>0&&(
            <Card style={{marginTop:16}}>
              <SLabel color={C}>TOTALS</SLabel>
              <div style={{display:"flex",gap:16}}>
                <div><div style={{fontSize:18,fontWeight:700,color:C,fontFamily:"'DM Mono',monospace"}}>{wins}</div><div style={{fontSize:9,color:"#444",fontFamily:"'DM Mono',monospace"}}>WINS</div></div>
                <div><div style={{fontSize:18,fontWeight:700,color:"#FF4D4D",fontFamily:"'DM Mono',monospace"}}>{losses}</div><div style={{fontSize:9,color:"#444",fontFamily:"'DM Mono',monospace"}}>LOSSES</div></div>
                <div><div style={{fontSize:18,fontWeight:700,color:C,fontFamily:"'DM Mono',monospace"}}>{totalHours}h</div><div style={{fontSize:9,color:"#444",fontFamily:"'DM Mono',monospace"}}>ON COURT</div></div>
              </div>
            </Card>
          )}
        </div>
      )}
 
      {tab==="focus"&&(
        <div>
          <SLabel color={C}>FOCUS AREAS</SLabel>
          {[
            {title:"Serve improvement",sub:"Placement to the T and body. Consistency before power."},
            {title:"Vibora / Smash",sub:"Attacking overhead — feet positioning, snap wrist at contact."},
            {title:"Net hands",sub:"Quick reflex volleys. Partner feeds rapid balls to both sides."},
            {title:"Tactical positioning",sub:"Left side hit → cover middle immediately. Hold formation."},
            {title:"Bandeja off glass",sub:"Height and angle — aim deep. Work on consistency."},
          ].map((f,i)=>(
            <Card key={i} style={{marginBottom:8}}>
              <div style={{fontSize:13,fontWeight:600,color:"#fff",fontFamily:"'Outfit',sans-serif",marginBottom:3}}>{f.title}</div>
              <div style={{fontSize:12,color:"#555",fontFamily:"'Outfit',sans-serif",lineHeight:1.5}}>{f.sub}</div>
            </Card>
          ))}
        </div>
      )}
    </div>
  );
}
 
// ─── ROOT ─────────────────────────────────────────────────────────────────────
function App() {
  const [section, setSection] = useState("gym");
  const [gymTab, setGymTab]   = useState("plan");
  const [loaded, setLoaded]   = useState(false);
 
  const [gymHistory, setGymHistory] = useState([]);
  const [lastVals, setLastVals]     = useState({});
  const [padelGames, setPadelGames] = useState([]);
 
  useEffect(()=>{
    Promise.all([
      DB.get("gym_history",[]),
      DB.get("gym_last_vals",{}),
      DB.get("padel_games",[]),
    ]).then(([gh,lv,pg])=>{
      setGymHistory(gh); setLastVals(lv); setPadelGames(pg); setLoaded(true);
    });
  },[]);
 
  const SECTIONS = [
    { id:"gym",   label:"GYM",   icon:"💪", color:COLORS.gym },
    { id:"padel", label:"PADEL", icon:"🎾", color:COLORS.padel },
  ];
  const sec = SECTIONS.find(s=>s.id===section);
 
  if (!loaded) return (
    <div style={{minHeight:"100vh",background:"#060606",display:"flex",alignItems:"center",justifyContent:"center"}}>
      <Loader/>
    </div>
  );
 
  return (
    <div style={{minHeight:"100vh",background:"#060606",fontFamily:"'Outfit',sans-serif"}}>
      <style>{`
        @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
        input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
        input[type=number]{-moz-appearance:textfield}
        *{box-sizing:border-box}
        ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:#111}::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:2px}
        select option{background:#161616;color:#fff}
      `}</style>
 
      {/* Header */}
      <div style={{background:"#080808",borderBottom:"1px solid #1a1a1a",padding:"16px 20px 0",position:"sticky",top:0,zIndex:20}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <div style={{fontSize:24,fontFamily:"'Bebas Neue',sans-serif",color:"#fff",letterSpacing:3}}>TRAINER</div>
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <div style={{width:6,height:6,borderRadius:"50%",background:sec.color,boxShadow:`0 0 6px ${sec.color}`}}/>
            <span style={{fontSize:9,color:sec.color,fontFamily:"'DM Mono',monospace",letterSpacing:2}}>{sec.label}</span>
          </div>
        </div>
        {/* Nav */}
        <div style={{display:"flex",gap:0}}>
          {SECTIONS.map(s=>(
            <button key={s.id} onClick={()=>setSection(s.id)}
              style={{flex:1,padding:"10px 0",background:"none",border:"none",cursor:"pointer",
                borderBottom:`2px solid ${section===s.id?s.color:"transparent"}`,
                color:section===s.id?"#fff":"#444",
                fontFamily:"'DM Mono',monospace",fontSize:11,fontWeight:700,letterSpacing:2,transition:"all .15s"}}>
              {s.icon} {s.label}
            </button>
          ))}
        </div>
        {section==="gym"&&(
          <div style={{display:"flex",gap:0,paddingTop:1}}>
            {[["plan","PROGRAM"],["log","WORKOUT"],["history","HISTORY"]].map(([t,l])=>(
              <button key={t} onClick={()=>setGymTab(t)}
                style={{flex:1,padding:"7px 0",background:"none",border:"none",cursor:"pointer",
                  color:gymTab===t?sec.color:"#333",fontFamily:"'DM Mono',monospace",fontSize:9,letterSpacing:2}}>
                {l}
              </button>
            ))}
          </div>
        )}
      </div>
 
      {/* Content */}
      <div style={{padding:"16px 16px 80px",maxWidth:540,margin:"0 auto"}}>
        {section==="gym"   && <GymSection tab={gymTab} setTab={setGymTab} history={gymHistory} setHistory={setGymHistory} lastVals={lastVals} setLastVals={setLastVals}/>}
        {section==="padel" && <PadelSection games={padelGames} setGames={setPadelGames}/>}
      </div>
    </div>
  );
}
 
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
 
</script>
</body>
</html>
